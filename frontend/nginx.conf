server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # resolve `backend` per request via Docker DNS (survives backend recreate)
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;              # backend down → fast JSON 503 instead of a long wait
    set $api_upstream http://backend:8000;

    location /api/ {
        proxy_pass $api_upstream;     # no URI → /api/tickets forwarded as-is
        proxy_connect_timeout 3s;     # stopped backend (stale cached IP) → quick 503, not a 60s hang
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # API answers must be JSON even when nginx itself has to reply
        error_page 502 503 504 = @api_unavailable;
        error_page 413 = @api_too_large;
    }

    location @api_unavailable {
        default_type application/json;
        return 503 '{"error":"backend unavailable, please try again shortly"}';
    }

    location @api_too_large {
        default_type application/json;
        return 413 '{"error":"request body too large"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
